{% extends 'base.html' %}
{% block title %}Delete Tour — TripAZ{% endblock %}
{% block content %}
<div class="container section-sm" style="max-width:480px;">
  <div class="card">
    <div class="card-body" style="text-align:center;padding:40px;">
      <div style="font-size:3rem;margin-bottom:16px;">🗑</div>
      <h2 style="margin-bottom:8px;">Delete Tour?</h2>
      <p style="margin-bottom:24px;">Are you sure you want to delete "<strong>{{ tour.title }}</strong>"? This cannot be undone.</p>
      <form method="post" style="display:flex;gap:12px;justify-content:center;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'guides:dashboard' %}" class="btn btn-outline">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
